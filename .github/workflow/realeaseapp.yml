name: Build and Release APK

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout source
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Java 17
      # AGP 8.7.x is built/tested with JDK 17
      # ---------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # 3. Install Gradle 8.9
      # Your project uses AGP 8.7.3
      # ---------------------------------------------------------
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ---------------------------------------------------------
      # 4. Check environment
      # ---------------------------------------------------------
      - name: Check Java and Gradle
        run: |
          java -version
          gradle --version

      # ---------------------------------------------------------
      # 5. Make sure Android SDK components are available
      # ---------------------------------------------------------
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed | head -100 || true

      # ---------------------------------------------------------
      # 6. Clean previous builds
      # ---------------------------------------------------------
      - name: Clean project
        run: |
          gradle clean --stacktrace

      # ---------------------------------------------------------
      # 7. Build release APK
      #
      # The existing project does not contain a Gradle signing
      # configuration, so we intentionally build the APK first
      # and sign it with Android SDK apksigner afterward.
      # ---------------------------------------------------------
      - name: Build release APK
        run: |
          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ---------------------------------------------------------
      # 8. Locate unsigned APK
      # ---------------------------------------------------------
      - name: Locate release APK
        run: |
          find app/build/outputs/apk/release -type f -name "*.apk" -print

      # ---------------------------------------------------------
      # 9. Decode keystore from GitHub Secret
      # ---------------------------------------------------------
      - name: Create release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is empty."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

          if [ ! -s release-keystore.jks ]; then
            echo "::error::Keystore file was not created."
            exit 1
          fi

          echo "Keystore decoded successfully."

      # ---------------------------------------------------------
      # 10. Find Android build-tools
      # ---------------------------------------------------------
      - name: Find Android build tools
        id: buildtools
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            | sort -V \
            | tail -1 \
            | xargs basename)

          if [ -z "$BUILD_TOOLS" ]; then
            echo "::error::Android build-tools were not found."
            exit 1
          fi

          echo "version=$BUILD_TOOLS" >> "$GITHUB_OUTPUT"
          echo "Using Android Build Tools: $BUILD_TOOLS"

      # ---------------------------------------------------------
      # 11. Zipalign APK before signing
      # ---------------------------------------------------------
      - name: Zipalign APK
        env:
          BUILD_TOOLS: ${{ steps.buildtools.outputs.version }}
        run: |
          INPUT_APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$INPUT_APK" ]; then
            echo "::error::Release APK was not found."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" \
            -P 16 \
            -f \
            -v 4 \
            "$INPUT_APK" \
            app-release-aligned.apk

      # ---------------------------------------------------------
      # 12. Sign APK
      # ---------------------------------------------------------
      - name: Sign APK
        env:
          BUILD_TOOLS: ${{ steps.buildtools.outputs.version }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD secret is empty."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::KEY_ALIAS secret is empty."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::KEY_PASSWORD secret is empty."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
            --ks release-keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out TextToPDF-release.apk \
            app-release-aligned.apk

      # ---------------------------------------------------------
      # 13. Verify signature
      # ---------------------------------------------------------
      - name: Verify APK signature
        env:
          BUILD_TOOLS: ${{ steps.buildtools.outputs.version }}
        run: |
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify \
            --verbose \
            TextToPDF-release.apk

          echo "APK signature verification completed."

      # ---------------------------------------------------------
      # 14. Show APK information
      # ---------------------------------------------------------
      - name: APK information
        run: |
          ls -lh TextToPDF-release.apk

      # ---------------------------------------------------------
      # 15. Upload APK as GitHub Actions artifact
      # ---------------------------------------------------------
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: TextToPDF-release
          path: TextToPDF-release.apk
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------
      # 16. Create GitHub Release when workflow was triggered
      # by a tag such as v1.0.0
      # ---------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            TextToPDF-release.apk \
            --title "Text to PDF ${GITHUB_REF_NAME}" \
            --generate-notes
